name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PNPM_VERSION: '9.15.0'
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Every assertion in packages/db/pgtap/phase0.sql was first proven by
  # hand against a live Postgres 16 container (see MEMORY.md for that
  # session); this job is what re-proves it on every PR. The apt-get
  # pgtap install step and the "psql doesn't propagate TAP failures"
  # gotcha below were both found by running this job for real in CI —
  # see MEMORY.md for the two bugs that surfaced and how they were fixed.
  pgtap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP into the postgres service container
        run: docker exec ${{ job.services.postgres.id }} sh -c "apt-get update && apt-get install -y postgresql-16-pgtap"
      - name: Apply schema, RLS/functions, and the local auth stub
        run: |
          psql -v ON_ERROR_STOP=1 -f packages/db/scripts/local-auth-stub.sql
          for f in packages/db/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap;"
      - name: Run pgTAP suite
        # psql exits 0 regardless of how many pgTAP assertions failed —
        # throws_ok/is/etc. never raise, they just print "not ok" text.
        # Found this the hard way: this job reported "pass" while pgTAP
        # itself said "failed 9 tests of 15" (see MEMORY.md). Fail the
        # step explicitly if any assertion line reads "not ok".
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f packages/db/pgtap/phase0.sql | tee /tmp/pgtap-output.txt
          if grep -q '^not ok' /tmp/pgtap-output.txt; then
            echo "::error::pgTAP reported one or more failing assertions"
            exit 1
          fi
