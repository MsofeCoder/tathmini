<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: #14171A; -webkit-font-smoothing: antialiased; }
    a { color: #E4693A; }
    a:hover { color: #C9552A; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #14171A; color: #E7EAEC; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; padding: 40px 56px 32px 56px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <div style="display: flex; align-items: baseline; gap: 20px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 2.4px; color: #E4693A;">SHEET 05 / 05</span>
      <h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.8px;">Colourways</h2>
      <span style="font-size: 15px; color: #98A1A8;">Six launch finishes, one cladding family</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11.5px; color: #6E767D; letter-spacing: 1.4px;">TE-1 · PAINT · REV B</span>
  </div>

  <div style="display: flex; align-items: center; gap: 32px; flex-grow: 1; min-height: 0;">
    <div style="flex-grow: 1; min-width: 0;">
      <svg viewBox="0 0 1220 440" width="100%" style="display: block;" xmlns="http://www.w3.org/2000/svg">
        <line x1="20" y1="418" x2="1200" y2="418" stroke="#394046" stroke-width="1"></line>
        <ellipse cx="606" cy="418" rx="520" ry="12" fill="#0D0F11"></ellipse>

        <path d="M 60 386 L 60 300 Q 60 276 86 266 L 148 232 L 300 194 L 372 62 Q 378 50 394 50 L 786 50 Q 802 50 808 60 L 852 152 L 1148 152 L 1148 202 L 1152 202 L 1152 360 Q 1152 382 1130 386 L 1020.5 386 A 92 92 0 0 0 849.5 386 L 340.5 386 A 92 92 0 0 0 169.5 386 Z" fill="{{ sel.body }}" stroke="{{ sel.line }}" stroke-width="1.6" stroke-linejoin="round"></path>

        <path d="M 392 66 L 556 66 L 556 158 L 350 158 Z M 568 66 L 740 66 L 740 158 L 568 158 Z M 752 66 L 792 66 L 814 158 L 752 158 Z" fill="#171B1F" stroke="{{ sel.line }}" stroke-width="1.2" opacity="0.92"></path>
        <path d="M 352 160 L 356 372 M 562 66 L 562 372 M 746 66 L 746 372 M 852 152 L 850 380 M 356 372 L 852 372 M 856 200 L 1146 200" fill="none" stroke="{{ sel.line }}" stroke-width="1.1" opacity="0.55"></path>

        <path d="M 340.5 386 A 92 92 0 0 0 169.5 386" fill="none" stroke="{{ sel.clad }}" stroke-width="12"></path>
        <path d="M 1020.5 386 A 92 92 0 0 0 849.5 386" fill="none" stroke="{{ sel.clad }}" stroke-width="12"></path>
        <rect x="356" y="366" width="496" height="12" rx="4" fill="{{ sel.clad }}"></rect>
        <rect x="430" y="43" width="220" height="8" rx="4" fill="{{ sel.clad }}"></rect>
        <rect x="452" y="170" width="36" height="9" rx="4.5" fill="{{ sel.clad }}"></rect>
        <rect x="636" y="170" width="36" height="9" rx="4.5" fill="{{ sel.clad }}"></rect>
        <path d="M 326 148 L 298 140 L 294 156 L 322 163 Z" fill="{{ sel.clad }}" stroke="{{ sel.line }}" stroke-width="1.1" stroke-linejoin="round"></path>

        <path d="M 64 290 L 100 270" stroke="{{ sel.accent }}" stroke-width="6" stroke-linecap="round"></path>
        <rect x="1143" y="215" width="9" height="88" rx="3" fill="{{ sel.accent }}"></rect>

        <g stroke="{{ sel.line }}" stroke-width="1.3">
          <circle cx="255" cy="352" r="78" fill="#141618"></circle>
          <circle cx="255" cy="352" r="46" fill="{{ sel.wheel }}"></circle>
          <circle cx="935" cy="352" r="78" fill="#141618"></circle>
          <circle cx="935" cy="352" r="46" fill="{{ sel.wheel }}"></circle>
        </g>
        <g stroke="{{ sel.clad }}" stroke-width="3" stroke-linecap="round">
          <path d="M 270 352 L 298 352 M 262.5 365 L 276.5 389.2 M 247.5 365 L 233.5 389.2 M 240 352 L 212 352 M 247.5 339 L 233.5 314.8 M 262.5 339 L 276.5 314.8"></path>
          <path d="M 950 352 L 978 352 M 942.5 365 L 956.5 389.2 M 927.5 365 L 913.5 389.2 M 920 352 L 892 352 M 927.5 339 L 913.5 314.8 M 942.5 339 L 956.5 314.8"></path>
        </g>
      </svg>
    </div>

    <div style="width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; border-left: 1px solid #2A3035; padding-left: 26px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 1.8px; color: #6E767D;">SELECTED</span>
        <span style="font-size: 30px; font-weight: 700; letter-spacing: -1px; line-height: 1.1;">{{ sel.name }}</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; color: #E4693A;">{{ sel.code }}</span>
      </div>
      <div style="display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #6E767D;">
        <span>FINISH</span><span style="color: #E7EAEC; text-align: right;">{{ sel.finish }}</span>
        <span>BODY</span><span style="color: #E7EAEC; text-align: right;">{{ sel.body }}</span>
        <span>CLADDING</span><span style="color: #E7EAEC; text-align: right;">{{ sel.clad }}</span>
        <span>SIGNATURE</span><span style="color: #E7EAEC; text-align: right;">{{ sel.accent }}</span>
      </div>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #98A1A8; text-wrap: pretty;">{{ sel.note }}</p>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; flex-shrink: 0;">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
      <button onClick="{{ c.pick }}" style="{{ c.style }}" style-focus="outline: 3px solid #E4693A; outline-offset: 3px;">
        <div style="height: 62px; border-radius: 7px; background: {{ c.body }}; display: flex; align-items: flex-end; padding: 6px; gap: 5px;">
          <div style="width: 26px; height: 12px; border-radius: 3px; background: {{ c.clad }};"></div>
          <div style="width: 12px; height: 12px; border-radius: 3px; background: {{ c.accent }};"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-start;">
          <span style="font-size: 15px; font-weight: 500; letter-spacing: -0.1px;">{{ c.name }}</span>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #6E767D;">{{ c.code }}</span>
        </div>
      </button>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const defs = [
      { id: 'miombo', name: 'Miombo Green', code: 'TE-1 / P01', body: '#3D4A3B', clad: '#15181A', accent: '#E4693A', wheel: '#2C3237', line: '#C6CCD2', finish: 'Matte, two coat', note: 'The programme colour. Reads as equipment rather than lifestyle, and hides dust between washes.' },
      { id: 'ochre', name: 'Dust Ochre', code: 'TE-1 / P02', body: '#B9873F', clad: '#15181A', accent: '#2E2A24', wheel: '#3A342B', line: '#2A2A26', finish: 'Matte, two coat', note: 'Takes the colour of the road it works on. Highest visibility of the six in low sun.' },
      { id: 'basalt', name: 'Basalt', code: 'TE-1 / P03', body: '#2B2F33', clad: '#15181A', accent: '#E4693A', wheel: '#20252A', line: '#C6CCD2', finish: 'Satin, two coat', note: 'Cladding and body nearly merge, so the vehicle reads as one mass and the light signature carries the identity.' },
      { id: 'salt', name: 'Salt White', code: 'TE-1 / P04', body: '#E4E0D6', clad: '#15181A', accent: '#C4552A', wheel: '#8E9298', line: '#3A4046', finish: 'Gloss, single coat', note: 'Fleet default. Coolest cabin at rest and the cheapest panel to replace.' },
      { id: 'rift', name: 'Rift Blue', code: 'TE-1 / P05', body: '#2E4A5C', clad: '#15181A', accent: '#E9B44C', wheel: '#2C3237', line: '#C6CCD2', finish: 'Satin, two coat', note: 'The one cool option. Amber signature instead of orange so the front stays legible against the body.' },
      { id: 'signal', name: 'Signal Orange', code: 'TE-1 / P06', body: '#BF5228', clad: '#15181A', accent: '#F2EDE4', wheel: '#2C3237', line: '#1A1B18', finish: 'Gloss, two coat', note: 'Utility and rescue specification. Signature inverts to white so it does not disappear into the body.' }
    ];

    const picked = this.state && this.state.pick ? this.state.pick : 'miombo';
    const sel = defs.find((d) => d.id === picked) || defs[0];

    const base = 'display: flex; flex-direction: column; gap: 9px; padding: 9px; border-radius: 11px; cursor: pointer; background: #1A1E22; color: #E7EAEC; text-align: left; border: 1px solid ';

    const chips = defs.map((d) => Object.assign({}, d, {
      style: base + (d.id === picked ? '#E4693A;' : '#2A3035;'),
      pick: () => this.setState({ pick: d.id })
    }));

    return { sel: sel, chips: chips };
  }
}
</script>
</body>
</html>
